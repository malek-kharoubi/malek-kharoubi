name: Profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# A push, a schedule tick and a manual run can overlap; serialize them so
# two jobs never race to push to main.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check METRICS_TOKEN is set
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Repository secret METRICS_TOKEN is empty or missing (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi

      - name: Header
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.header.svg
          base: header
          user: malek-kharoubi

      - name: Languages (private repos included)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          user: malek-kharoubi
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          base: ""
          user: malek-kharoubi
          plugin_calendar: yes
          plugin_calendar_limit: 1

  snake:
    runs-on: ubuntu-latest
    needs: metrics
    # still draw the snake if a metrics step fails; it only needs the latest main
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake.svg
            snake-dark.svg?palette=github-dark
      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg
          git diff --cached --quiet || (git commit -m "update snake" && git pull --rebase && git push)
