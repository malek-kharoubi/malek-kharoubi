name: Profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# A push, a schedule tick and a manual run can overlap; serialize them so
# two jobs never race to push to main.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check METRICS_TOKEN is set
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Repository secret METRICS_TOKEN is empty or missing (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi

      - name: Header
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.header.svg
          base: header
          user: malek-kharoubi

      - name: Languages (private repos included)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          user: malek-kharoubi
          # default is "owner" only, which leaves out organization repos
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

  calendar:
    runs-on: ubuntu-latest
    needs: metrics
    # the metrics job commits to main through the API; run after it and even if it fails
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render contribution calendar
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python .github/scripts/contributions.py malek-kharoubi contributions.svg
      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          git diff --cached --quiet || (git commit -m "update contribution calendar" && git pull --rebase && git push)
